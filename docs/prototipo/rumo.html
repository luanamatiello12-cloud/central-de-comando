<meta charset="utf-8">
<title>Rumo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: navegação lateral fixa (desktop) / barra inferior (celular); conteúdo em coluna de 960px, cada área uma vista com hash */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E7ECE9; --line:#D5DDD8;
  --ink:#14201B; --muted:#5B6B63; --accent:#1F5F4A; --accent-ink:#FFFFFF; --accent-soft:#DCEBE4;
  --warm:#B7791F; --warm-soft:#F6EBD6;
  --good:#1E7A46; --bad:#B42318; --bad-soft:#FBE4E1;
  --toast-bg:#14201B; --toast-fg:#F2F5F3; --toast-link:#8FD9B9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201C; --sunk:#1D2925; --line:#2A3832;
  --ink:#E6EEEA; --muted:#93A59C; --accent:#5FBF9A; --accent-ink:#0B1411; --accent-soft:#1E3A30;
  --warm:#E3A947; --warm-soft:#3A2F1A; --good:#5CC48A; --bad:#F2877B; --bad-soft:#3A1F1C;
  --toast-bg:#E6EEEA; --toast-fg:#0E1513; --toast-link:#1F5F4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201C; --sunk:#1D2925; --line:#2A3832;
  --ink:#E6EEEA; --muted:#93A59C; --accent:#5FBF9A; --accent-ink:#0B1411; --accent-soft:#1E3A30;
  --warm:#E3A947; --warm-soft:#3A2F1A; --good:#5CC48A; --bad:#F2877B; --bad-soft:#3A1F1C;
  --toast-bg:#E6EEEA; --toast-fg:#0E1513; --toast-link:#1F5F4A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:28px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;margin:0 8px 24px}
.brand b{font-family:var(--f-display);font-size:1.4rem}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.navlink:hover{background:var(--sunk);color:var(--ink)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navlink svg{width:18px;height:18px;flex:none}
.sync{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 8px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warm)}

main{padding-block:32px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:.85rem}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);padding:5px 6px;border-radius:6px;font-size:.8rem;white-space:nowrap}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;display:block}
.acts{display:flex;gap:2px;flex:none;align-items:center}

form.row{display:flex;gap:8px;flex-wrap:wrap}
.field{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.field:focus{border-color:var(--accent);outline:none}
.grow{flex:1 1 200px}
textarea.field{resize:vertical;min-height:80px;width:100%}
.hint{font-size:.82rem;color:var(--accent);min-height:1.25em;flex-basis:100%}
.editform{display:flex;flex-wrap:wrap;gap:8px;width:100%;padding:4px 0;align-items:center}
.editform textarea{flex-basis:100%}
.editbtns{display:flex;gap:6px}

ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
ul.list li:first-child{border-top:0}
.li-main{flex:1;min-width:0;overflow-wrap:anywhere}
.li-sub{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{appearance:none;width:20px;height:20px;border:2px solid var(--line);border-radius:6px;cursor:pointer;flex:none;display:grid;place-content:center;background:var(--surface)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:10px;height:6px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .li-main>span:first-child{text-decoration:line-through;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.chip.today{background:var(--warm-soft);color:var(--warm)}
.chip.high{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:var(--warm-soft);color:var(--warm)}
.chip.routine{background:var(--accent-soft);color:var(--accent)}
.chip.paid{background:var(--accent-soft);color:var(--good)}

.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}

.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warm>i{background:var(--warm)}
.bar.over>i{background:var(--bad)}

.week{display:grid;grid-template-columns:repeat(7,28px);gap:4px}
.day{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.68rem;color:var(--muted);display:grid;place-content:center;font-family:var(--f-mono)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.is-today{outline:2px solid var(--warm);outline-offset:1px}
.streak{font-family:var(--f-mono);font-size:.82rem;color:var(--warm);white-space:nowrap}

.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:9px;width:fit-content;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.notice{background:var(--warm-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.88rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.note .txt{white-space:pre-wrap}
.note.pin{border-color:var(--warm);background:var(--warm-soft)}
.note footer{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--muted)}

.catrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}

.days{display:flex;flex-direction:column;gap:10px}
.dayrow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.dayrow.is-today{border-color:var(--warm)}
.dayhead{display:flex;flex-direction:column;gap:2px}
.dayhead b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.dayrow.is-today .dayhead .label{color:var(--warm)}
.slots{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:10px;align-items:center}
.slot .t{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.slot .s{min-width:0;overflow-wrap:anywhere;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slot.done .s>span:first-child{text-decoration:line-through;color:var(--muted)}
.wdpick{display:flex;gap:4px;flex-wrap:wrap}
.wdpick label{position:relative;border:1px solid var(--line);background:var(--bg);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:.85rem;user-select:none}
.wdpick input{position:absolute;opacity:0;pointer-events:none}
.wdpick label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wdpick label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:.85rem}

.chartbox{display:flex;flex-direction:column;gap:6px}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;height:150px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 49px,var(--sunk) 49px 50px)}
.chart .col{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.chart .col i{width:min(18px,40%);border-radius:4px 4px 0 0;display:block;min-height:2px}
.chart i.in{background:var(--good)} .chart i.out{background:var(--bad);opacity:.8}
.chart-l{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;text-align:center;font-size:.75rem;color:var(--muted)}
.chart-l .cur{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:10px;display:flex;gap:16px;align-items:center;z-index:20;box-shadow:0 6px 24px rgb(0 0 0 / .25);font-size:.9rem;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:var(--toast-link);font-weight:600;cursor:pointer;padding:0}

nav.bottom{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  nav.bottom{display:flex;position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;z-index:5}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;color:var(--muted);text-decoration:none;padding:4px 2px;border-radius:8px;min-width:0}
  nav.bottom a[aria-current="page"]{color:var(--accent)}
  nav.bottom svg{width:20px;height:20px}
  .grid2,.grid3{grid-template-columns:1fr}
  h1{font-size:1.6rem}
  main{padding-block:20px 100px}
  .catrow{grid-template-columns:90px minmax(0,1fr) auto}
  .dayrow{grid-template-columns:1fr;gap:8px}
  .dayhead{flex-direction:row;align-items:baseline;gap:8px}
  .slot{grid-template-columns:76px minmax(0,1fr) auto}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s ease}}
</style>

<div class="app">
  <nav class="side" aria-label="Seções">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M13 4 L16 13 L13 22 L10 13 Z" fill="var(--accent)"/><circle cx="13" cy="13" r="1.6" fill="var(--surface)"/></svg><b>Rumo</b></div>
    <div id="sideLinks"></div>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Conectando…</span></div>
  </nav>
  <main><div class="wrap" id="view"></div></main>
  <nav class="bottom" id="bottomLinks" aria-label="Seções"></nav>
</div>
<div id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastUndo">Desfazer</button></div>

<script>
(() => {
// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const brl = v => (v < 0 ? "−" : "") + new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" }).format(Math.abs(v));
const fmtDate = s => s ? new Date(s + "T12:00:00").toLocaleDateString("pt-BR", { day:"2-digit", month:"short" }).replace(".", "") : "";
const fmtLong = s => s ? new Date(s + "T12:00:00").toLocaleDateString("pt-BR", { weekday:"short", day:"numeric", month:"short" }).replace(/\./g, "") : "";
const fmtNum = n => new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 }).format(+n || 0);
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const mondayOf = s => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const dim = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
const CATS_OUT = ["Moradia","Mercado","Transporte","Saúde","Lazer","Educação","Contas","Outros"];
const CATS_IN = ["Salário","Extra","Investimentos","Outros"];
const WD = ["D","S","T","Q","Q","S","S"];
const WDN = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

const ICONS = {
  hoje:'<path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/>',
  agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 17h6"/>',
  tarefas:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/>',
  habitos:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  financas:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  metas:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  notas:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  del:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
};
const ROUTES = [["hoje","Hoje"],["agenda","Agenda"],["tarefas","Tarefas"],["habitos","Hábitos"],["financas","Finanças"],["metas","Metas"],["notas","Notas"]];
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;

// ---------- datas em texto livre ("dentista sexta 14h", "pagar boleto dia 25") ----------
const WDAYS = { domingo:0, segunda:1, "terça":2, terca:2, quarta:3, quinta:4, sexta:5, "sábado":6, sabado:6 };
function parseQuick(raw){
  let s = " " + raw + " ", date = "", time = "";
  const td = today();
  const take = (re, fn) => { const m = s.match(re); if (m && fn(m) !== false) s = s.replace(m[0], " "); };
  take(/\s(?:às|as)?\s*(\d{1,2})(?:h(\d{2})?|:(\d{2}))(?=\s)/i, m => { const h = +m[1], mi = +(m[2] || m[3] || 0); if (h > 23 || mi > 59) return false; time = pad(h) + ":" + pad(mi); });
  take(/\sdepois de amanh[ãa](?=\s)/i, () => { date = addDays(td, 2); });
  if (!date) take(/\samanh[ãa](?=\s)/i, () => { date = addDays(td, 1); });
  if (!date) take(/\shoje(?=\s)/i, () => { date = td; });
  if (!date) take(/\s(?:(?:na|no|nesta|neste|pr[óo]xim[ao])\s)*(segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?(?=\s)/i, m => {
    const wd = WDAYS[m[1].toLowerCase()], cur = new Date(td + "T12:00:00").getDay(); date = addDays(td, ((wd - cur + 7) % 7) || 7); });
  if (!date) take(/\s(?:dia\s)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/i, m => {
    let y = m[3] ? +m[3] : +td.slice(0, 4); if (y < 100) y += 2000;
    const mo = +m[2], d = +m[1]; if (mo < 1 || mo > 12 || d < 1 || d > 31) return false;
    date = `${y}-${pad(mo)}-${pad(d)}`; if (!m[3] && date < td) date = `${y + 1}-${pad(mo)}-${pad(d)}`; });
  if (!date) take(/\sdia\s(\d{1,2})(?=\s)/i, m => {
    const d = +m[1]; if (d < 1 || d > 31) return false;
    let mo = td.slice(0, 7); if (`${mo}-${pad(d)}` < td) { const x = new Date(td + "T12:00:00"); x.setDate(1); x.setMonth(x.getMonth() + 1); mo = iso(x).slice(0, 7); }
    date = `${mo}-${pad(Math.min(d, dim(mo)))}`; });
  let title = s.replace(/\s+/g, " ").trim();
  for (let i = 0; i < 3; i++) title = title.replace(/\s+(às|as|na|no|em|de|dia|para|pra|até)$/i, "").trim();
  return { title: title || raw.trim(), date, time };
}

// ---------- armazenamento ----------
const LS_KEY = "rumo.local.v1";
const S = {
  items: new Map(), mode: "loading", col: null, chains: new Map(), loaded: false,
  list(kind){ return [...this.items.values()].filter(x => x.kind === kind); },
  saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(Object.fromEntries(this.items))); } catch {} },
  loadLocal(){ try { const o = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); this.items = new Map(Object.entries(o)); } catch { this.items = new Map(); } },
  async put(id, data){
    const body = { ...data, id };
    this.items.set(id, body); render();
    if (this.mode !== "cloud") { this.saveLocal(); return; }
    const { id: _drop, ...clean } = body;
    const prev = this.chains.get(id) || Promise.resolve();
    const next = prev.then(() => this.col.doc(id).set(clean)).catch(e => setSync("warn", e?.code === "quota_exceeded" ? "Espaço cheio — apague itens antigos" : "Não foi possível salvar"));
    this.chains.set(id, next); return next;
  },
  patch(id, part){ const cur = this.items.get(id); if (cur) return this.put(id, { ...cur, ...part }); },
  async remove(id){
    this.items.delete(id); render();
    if (this.mode !== "cloud") { this.saveLocal(); return; }
    const prev = this.chains.get(id) || Promise.resolve();
    const next = prev.then(() => this.col.doc(id).delete()).catch(() => setSync("warn", "Não foi possível excluir"));
    this.chains.set(id, next); return next;
  }
};
function setSync(state, text){ $("#syncDot").className = "dot " + (state === "ok" ? "ok" : state === "warn" ? "warn" : ""); $("#syncText").textContent = text; }

async function boot(){
  render();
  let db = null, user = null;
  if (window.claude?.use) {
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch {}
  }
  const id = user ? await user.id() : null;
  if (!db || !id) {
    S.mode = "local"; S.loadLocal(); S.loaded = true;
    setSync("warn", "Salvo só neste navegador");
    render(); return;
  }
  S.mode = "cloud"; S.col = db.collection("data/users/" + id);
  const timer = setTimeout(() => { if (!S.loaded) setSync("warn", "Sem conexão com seus dados ainda"); }, 10000);
  S.col.onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => m.set(d.id, { ...d.data(), id: d.id }));
    S.items = m;
    if (!snap.metadata.fromCache) { S.loaded = true; clearTimeout(timer); setSync("ok", "Sincronizado na sua conta"); }
    else if (!S.loaded) { S.loaded = true; }
    render();
  }, () => { clearTimeout(timer); S.loaded = true; setSync("warn", "Conexão perdida — recarregue a página"); render(); });
}

function removeWithUndo(id){
  const x = S.items.get(id); if (!x) return;
  const restore = [{ ...x }];
  const b = x.billId && S.items.get(x.billId);
  if (b) { restore.push({ ...b }); const paid = { ...(b.paid || {}) }; Object.keys(paid).forEach(k => { if (paid[k] === id) delete paid[k]; }); S.patch(b.id, { paid }); }

// ---------- cálculos ----------
function streak(h){
  const log = h.log || {}; let d = today(), n = 0;
  if (!log[d]) d = addDays(d, -1);
  while (log[d]) { n++; d = addDays(d, -1); }
  return n;
}
function monthTx(m){ return S.list("tx").filter(t => (t.date || "").startsWith(m)); }
function sums(list){ let inc = 0, out = 0; list.forEach(t => t.type === "in" ? inc += +t.amount : out += +t.amount); return { inc, out, bal: inc - out }; }
function openTasks(){
  const pr = { alta:0, media:1, baixa:2 };
  return S.list("task").filter(t => !t.done).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || (pr[a.priority] ?? 1) - (pr[b.priority] ?? 1));
}
const billDue = (b, m) => m + "-" + pad(Math.min(+b.day || 1, dim(m)));

function dueChip(t){
  if (!t.due) return "";
  const td = today();
  if (t.done) return `<span>${fmtDate(t.due)}</span>`;
  return t.due < td ? `<span class="chip late">atrasada · ${fmtDate(t.due)}</span>` : t.due === td ? `<span class="chip today">hoje</span>` : `<span>${fmtLong(t.due)}</span>`;
}
function taskLi(t){
  if (ui.editing === t.id) return `<li>${editForm(t)}</li>`;
  const pending = !t.done && t.due && t.due <= today();
  return `<li class="${t.done ? "done" : ""}">
    <input type="checkbox" class="check" data-task="${esc(t.id)}" ${t.done ? "checked" : ""} aria-label="Concluir ${esc(t.title)}">
    <div class="li-main"><span>${esc(t.title)}</span>
      <div class="li-sub">${dueChip(t)}${t.priority === "alta" && !t.done ? '<span class="chip high">prioridade alta</span>' : ""}${exChip(t)}</div></div>
    ${pending ? `<button class="icon-btn" data-postpone="${esc(t.id)}" title="Passar para amanhã">Amanhã</button>` : ""}${acts(t)}</li>`;
}
function billChip(b, m){
  if (b.paid?.[m]) return '<span class="chip paid">paga</span>';
  const d = billDue(b, m), td = today();
  return d < td ? `<span class="chip late">atrasada · ${fmtDate(d)}</span>` : d === td ? '<span class="chip today">vence hoje</span>' : `<span class="chip">vence ${fmtDate(d)}</span>`;
}
const payBtn = (b, m) => `<button class="btn small" data-pay="${esc(b.id)}" data-m="${m}">${b.paid?.[m] ? "Desfazer" : "Marcar paga"}</button>`;
function dayAgenda(d, withTasks = true){
  const wd = new Date(d + "T12:00:00").getDay(), out = [], m = d.slice(0, 7);
  S.list("routine").forEach(r => { if ((r.days || []).includes(wd)) out.push({ k:"routine", time:r.time || "", end:r.end || "", x:r }); });
  S.list("event").forEach(e => { if (e.date === d) out.push({ k:"event", time:e.time || "", end:e.end || "", x:e }); });
  if (withTasks) S.list("task").forEach(t => { if (t.due === d) out.push({ k:"task", time:"", x:t }); });
  S.list("bill").forEach(b => { if (billDue(b, m) === d) out.push({ k:"bill", time:"", x:b }); });
  return out.sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
}
function slotHtml(s, d){
  const x = s.x, m = d.slice(0, 7);
  if (s.k === "event" && ui.editing === x.id) return `<div>${editForm(x)}</div>`;
  const time = s.time ? s.time + (s.end ? "–" + s.end : "") : ({ task:"tarefa", bill:"conta", event:"dia todo", routine:"" })[s.k];
  let body = "", act = "", cls = "";
  if (s.k === "routine") body = `<span>${esc(x.title)}</span><span class="chip routine">rotina</span>`;
  if (s.k === "event") { body = `<span>${esc(x.title)}</span>`; act = acts(x); }
  if (s.k === "task") { cls = x.done ? "done" : ""; body = `<span>${esc(x.title)}</span>${x.priority === "alta" && !x.done ? '<span class="chip high">alta</span>' : ""}`;
    act = `<input type="checkbox" class="check" data-task="${esc(x.id)}" ${x.done ? "checked" : ""} aria-label="Concluir ${esc(x.title)}">`; }
  if (s.k === "bill") { body = `<span>${esc(x.name)} · <span class="num">${brl(+x.amount)}</span></span>${billChip(x, m)}`; act = payBtn(x, m); }
  return `<div class="slot ${cls}"><span class="t">${time}</span><div class="s">${body}${exChip(x)}</div>${act}</div>`;
}
function weekStrip(h){
  const td = today(); let out = "";
  for (let i = 6; i >= 0; i--) {
    const d = addDays(td, -i), on = !!(h.log || {})[d], wd = new Date(d + "T12:00:00").getDay();
    out += `<button class="day ${on ? "on" : ""} ${d === td ? "is-today" : ""}" data-hab="${esc(h.id)}" data-day="${d}" aria-pressed="${on}" aria-label="${esc(h.name)} em ${fmtDate(d)}">${WD[wd]}</button>`;
  }
  return `<div class="week">${out}</div>`;
}

        <form class="row" id="billForm"><input class="field grow" id="bName" placeholder="Nova conta fixa" aria-label="Nome da conta" required>

        ${catNames.length ? catNames.map(catRow).join("") : '<span class="muted">Sem saídas neste mês.</span>'}
        <form class="row" id="budgetForm"><select class="field" id="lCat" aria-label="Categoria do limite">${CATS_OUT.map(c => `<option>${c}</option>`).join("")}</select>

    <section class="panel"><h2>Lançamentos</h2>
      ${txs.length ? `<ul class="list">${txs.map(t => ui.editing === t.id ? `<li>${editForm(t)}</li>` : `<li><div class="li-main"><span>${esc(t.desc)}</span><div class="li-sub"><span>${fmtDate(t.date)}</span><span>${esc(t.category || "")}</span>${t.billId ? '<span class="chip">conta fixa</span>' : ""}${exChip(t)}</div></div><span class="num ${t.type === "in" ? "pos" : "neg"}">${t.type === "in" ? "+" : "−"}${brl(+t.amount)}</span>${acts(t)}</li>`).join("")}</ul>` : emptyState("Nenhum lançamento neste mês.", true)}</section>`;

    ${ns.length ? `<div class="notes">${ns.map(n => ui.editing === n.id ? `<article class="note">${editForm(n)}</article>` : `<article class="note ${n.pinned ? "pin" : ""}"><div class="txt">${esc(n.text)}</div><footer><span>${n.createdAt ? new Date(n.createdAt).toLocaleDateString("pt-BR") : ""}${n.example ? " · exemplo" : ""}</span><span class="acts"><button class="icon-btn" data-pin="${esc(n.id)}">${n.pinned ? "Desafixar" : "Fixar"}</button>${acts(n)}</span></footer></article>`).join("")}</div>`

// ---------- dicas ao digitar ----------
function hintFor(id){
  const el = document.getElementById(id); if (!el) return "";
  const raw = el.value.trim(); if (!raw) return "";
  const p = parseQuick(raw), td = today();
  const when = d => d === td ? "hoje" : d === addDays(td, 1) ? "amanhã" : fmtLong(d);
  if (id === "qaText") return p.time ? `→ Compromisso “${p.title}” ${when(p.date || td)} às ${p.time}` : `→ Tarefa “${p.title}” para ${when(p.date || td)}`;
  if (id === "tTitle") return p.date ? `→ Prazo: ${when(p.date)}` : "";
  if (id === "eTitle") return (p.date || p.time) ? `→ ${p.date ? when(p.date) : "na data escolhida"}${p.time ? " às " + p.time : ""}` : "";
  return "";
}
function updateHints(){ [["qaText","qaHint"],["tTitle","tHint"],["eTitle","eHint"]].forEach(([i, h]) => { const el = document.getElementById(h); if (el) el.textContent = hintFor(i); }); }

function render(){
  navHtml();
  const v = $("#view");
  if (!S.loaded) { v.innerHTML = `<div class="head"><div><span class="label">Rumo</span><h1>Carregando seus dados…</h1><p>Agenda, tarefas, hábitos, finanças, metas e notas aparecem aqui em instantes.</p></div></div>`; return; }
  // guarda o que está sendo digitado para não perder ao redesenhar
  const saved = [], active = document.activeElement?.id;
  v.querySelectorAll("form input, form select, form textarea").forEach(el => {
    if (el.type === "checkbox") { if (el.name) saved.push(["cb", el.name, el.value, el.checked]); }
    else if (el.id) saved.push(["id", el.id, el.value]);
  });
  v.innerHTML = VIEWS[route()]();
  if (!ui.freshEdit) saved.forEach(([k, a, b, c]) => {
    if (k === "id") { const el = document.getElementById(a); if (el && v.contains(el)) el.value = b; }
    else { const el = v.querySelector(`input[name="${a}"][value="${b}"]`); if (el) el.checked = c; }
  });
  if (ui.freshEdit) { ui.freshEdit = false; const f = v.querySelector(".editform input, .editform textarea"); if (f) { f.focus(); if (f.select && f.type !== "date" && f.type !== "time") f.select(); } }
  else if (active) { const el = document.getElementById(active); if (el && v.contains(el)) el.focus(); }
  updateHints();
}

// ---------- eventos ----------
document.addEventListener("input", e => { if (["qaText","tTitle","eTitle"].includes(e.target.id)) updateHints(); });
document.addEventListener("change", e => { if (e.target.id === "xType") { ui.txType = e.target.value; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.editing) { ui.editing = null; render(); } });

document.addEventListener("click", e => {
  const t = e.target.closest("button, input[type=checkbox]"); if (!t) return;
  if (t.dataset.task) { const x = S.items.get(t.dataset.task); S.patch(x.id, { done: !x.done, doneAt: !x.done ? new Date().toISOString() : null }); return; }
  if (t.dataset.hab) { const h = S.items.get(t.dataset.hab); const log = { ...(h.log || {}) }; const d = t.dataset.day;
    if (log[d]) delete log[d]; else log[d] = true;
    const cut = addDays(today(), -400); Object.keys(log).forEach(k => { if (k < cut) delete log[k]; });
    S.patch(h.id, { log }); return; }
  if (t.dataset.del) { removeWithUndo(t.dataset.del); return; }
  if (t.dataset.editbtn) { ui.editing = t.dataset.editbtn; ui.freshEdit = true; render(); return; }
  if (t.hasAttribute("data-cancel")) { ui.editing = null; render(); return; }
  if (t.dataset.postpone) { S.patch(t.dataset.postpone, { due: addDays(today(), 1) }); return; }
  if (t.dataset.tt) { ui.taskTab = t.dataset.tt; render(); return; }
  if (t.dataset.month) { const d = new Date(ui.finMonth + "-15T12:00:00"); d.setMonth(d.getMonth() + +t.dataset.month); ui.finMonth = iso(d).slice(0, 7); render(); return; }
  if (t.dataset.pin) { const n = S.items.get(t.dataset.pin); S.patch(n.id, { pinned: !n.pinned }); return; }
  if (t.dataset.pay) { const b = S.items.get(t.dataset.pay), m = t.dataset.m, paid = { ...(b.paid || {}) };
    if (paid[m]) { S.remove(paid[m]); delete paid[m]; }
    else { const id = uid("x"); S.put(id, { kind:"tx", type:"out", desc:b.name, amount:+b.amount, category:b.category || "Contas", date:billDue(b, m), billId:b.id, createdAt:new Date().toISOString(), ...(b.example ? { example:true } : {}) }); paid[m] = id; }
    S.patch(b.id, { paid }); return; }
  if (t.dataset.week) { const n = +t.dataset.week; ui.weekStart = n === 0 ? mondayOf(today()) : addDays(ui.weekStart, 7 * n); render(); return; }
  if (t.dataset.af) { ui.agendaForm = t.dataset.af; render(); return; }
  if (t.hasAttribute("data-seed")) { seed(t.dataset.seed || ""); return; }
  if (t.hasAttribute("data-clear-ex")) { [...S.items.values()].filter(x => x.example).forEach(x => S.remove(x.id)); return; }
});

document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target, now = new Date().toISOString(), val = s => $(s).value, money = s => Math.round(parseFloat(val(s)) * 100) / 100;
  // edição de um item existente
  if (f.dataset.edit) {
    const x = S.items.get(f.dataset.edit); if (!x) return;
    const patch = {};
    FIELDS[x.kind].forEach(([k, type]) => {
      if (type === "days") { const days = [...f.querySelectorAll('input[name="edd"]:checked')].map(i => +i.value); if (days.length) patch.days = days; return; }
      let v = f.querySelector("#ed_" + k).value;
      if (type === "money") v = Math.round(parseFloat(v) * 100) / 100 || 0;
      else if (type === "number") v = parseFloat(v) || 0;
      else if (type === "day") v = Math.min(31, Math.max(1, parseInt(v) || 1));
      else if (type === "text" || type === "textarea") v = v.trim();
      patch[k] = v;
    });
    ui.editing = null; S.patch(x.id, patch); return;
  }
  let id, doc;  // lê os valores, limpa o formulário e só então salva (salvar redesenha a tela)
  if (f.id === "quickAdd") { const p = parseQuick(val("#qaText"));
    if (p.time) { id = uid("e"); doc = { kind:"event", title:p.title, date:p.date || today(), time:p.time, end:"", createdAt:now }; }
    else { id = uid("t"); doc = { kind:"task", title:p.title, due:p.date || today(), priority:"media", done:false, createdAt:now }; } }
  else if (f.id === "taskForm") { const p = parseQuick(val("#tTitle"));
    id = uid("t"); doc = { kind:"task", title:p.date ? p.title : val("#tTitle").trim(), due:val("#tDue") || p.date, priority:val("#tPri"), done:false, createdAt:now }; }
  else if (f.id === "habitForm") { id = uid("h"); doc = { kind:"habit", name:val("#hName").trim(), log:{}, createdAt:now }; }
  else if (f.id === "txForm") { const amt = money("#xAmt"); if (!(amt > 0)) return;
    const date = val("#xDate") || today(); ui.finMonth = date.slice(0, 7);
    id = uid("x"); doc = { kind:"tx", type:val("#xType"), desc:val("#xDesc").trim(), amount:amt, category:val("#xCat"), date, createdAt:now }; }
  else if (f.id === "goalForm") { id = uid("g"); doc = { kind:"goal", title:val("#gTitle").trim(), target:+val("#gTarget"), current:0, unit:val("#gUnit").trim(), deadline:val("#gDeadline"), createdAt:now }; }
  else if (f.id === "noteForm" || f.id === "quickNote") { id = uid("n"); doc = { kind:"note", text:f.querySelector("textarea").value.trim(), pinned:false, createdAt:now }; }
  else if (f.id === "eventForm") { const p = parseQuick(val("#eTitle"));
    id = uid("e"); doc = { kind:"event", title:(p.date || p.time) ? p.title : val("#eTitle").trim(), date:p.date || val("#eDate"), time:val("#eTime") || p.time, end:val("#eEnd"), createdAt:now }; }
  else if (f.id === "routineForm") { const days = [...f.querySelectorAll('input[name="rd"]:checked')].map(i => +i.value);
    if (!days.length) { $("#rErr").textContent = "Escolha pelo menos um dia da semana."; return; }
    id = uid("r"); doc = { kind:"routine", title:val("#rTitle").trim(), days, time:val("#rTime"), end:val("#rEnd"), createdAt:now }; }
  else if (f.id === "billForm") { const amt = money("#bAmt"), day = Math.min(31, Math.max(1, parseInt(val("#bDay")) || 1)); if (!(amt > 0)) return;
    id = uid("b"); doc = { kind:"bill", name:val("#bName").trim(), amount:amt, day, category:val("#bCat"), paid:{}, createdAt:now }; }
  else if (f.id === "budgetForm") { const limits = { ...(S.items.get("budget")?.limits || {}) }, c = val("#lCat"), v = Math.max(0, Math.round(+val("#lAmt") || 0));
    if (v) limits[c] = v; else delete limits[c];
    id = "budget"; doc = { kind:"budget", limits }; }
  else if (f.dataset.goal) { const g = S.items.get(f.dataset.goal), inc = parseFloat(f.querySelector("input").value); if (isNaN(inc)) return;
    f.reset(); S.patch(g.id, { current: Math.round(((+g.current || 0) + inc) * 100) / 100 }); return; }
  if (!doc) return;
  f.reset(); S.put(id, doc);
  if (f.id === "quickAdd") showToast(doc.kind === "event" ? `Compromisso salvo para ${doc.date === today() ? "hoje" : fmtLong(doc.date)} às ${doc.time}` : `Tarefa salva para ${doc.due === today() ? "hoje" : fmtLong(doc.due)}`, () => S.remove(id));
});

// ---------- exemplos ----------
function seed(key){
  const td = today(), m = td.slice(0, 7), now = new Date().toISOString(), ex = { example:true, createdAt:now };
  const log = days => Object.fromEntries(days.map(d => [addDays(td, -d), true]));
  const agenda = [
    { kind:"routine", title:"Academia", days:[1,3,5], time:"07:00", end:"08:00" },
    { kind:"routine", title:"Trabalho", days:[1,2,3,4,5], time:"08:30", end:"17:30" },
    { kind:"event", title:"Reunião de planejamento", date:td, time:"10:00", end:"11:00" },
    { kind:"event", title:"Consulta médica", date:addDays(td, 2), time:"14:30", end:"" },
    { kind:"event", title:"Aniversário da Ana", date:addDays(td, 4), time:"", end:"" }
  ];
